[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-configurator"
version = "0.4.0"
description = "Manage ~/.claude and cross-vendor AI agent rules: 7-vendor adapters, decision packs, AGENTS.md composition."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Simtabi LLC", email = "opensource@simtabi.com" }]
keywords = ["claude", "claude-code", "dotfiles", "symlink", "config-manager"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: System :: Installation/Setup",
  "Topic :: Utilities",
]
requires-python = ">=3.10"
dependencies = []  # stdlib only: argparse, pathlib, subprocess, json, fnmatch

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-mock>=3.14",
  "ruff>=0.9",
  "mypy>=1.13",
]

[project.scripts]
ai-configurator = "ai_configurator.cli:main"

[project.urls]
Homepage      = "https://opensource.simtabi.com/products/ai-configurator"
Documentation = "https://opensource.simtabi.com/documentation/ai-configurator"
Repository    = "https://github.com/simtabi/claude-configs"
Issues        = "https://github.com/simtabi/claude-configs/issues"
Changelog     = "https://github.com/simtabi/claude-configs/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_configurator"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_configurator/py.typed" = "ai_configurator/py.typed"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/ai_configurator"]
