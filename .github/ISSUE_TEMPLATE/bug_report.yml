name: Bug report
description: Something doesn't work the way the docs say it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Exact command, exact output, exact expected output.
      placeholder: |
        Ran: ai-config-kit bootstrap --no-git
        Saw: ...
        Expected: ...
    validations:
      required: true

  - type: textarea
    id: status-output
    attributes:
      label: Status and doctor output
      description: Paste the output of `ai-config-kit status` and `ai-config-kit doctor`.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: ai-config-kit version
      description: Output of `ai-config-kit --version`.
      placeholder: ai-config-kit 0.2.0
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.12.5
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 14.5 / Ubuntu 24.04
    validations:
      required: true
